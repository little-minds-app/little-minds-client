name: LMP-25 Parent Web Bootstrap

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web-bootstrap:
    name: Next.js responsive shell - lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned dependencies
        run: npm ci --no-audit --no-fund
      - name: Static checks
        run: |
          npm run lint
          npm run typecheck
      - name: Responsive shell regression
        run: npm test
      # Production build is already validated by Client CI / Next.js Build.
      # Keep this job and its legacy check name stable for existing PR policies.
