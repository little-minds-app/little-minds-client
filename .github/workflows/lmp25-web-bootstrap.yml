name: LMP-25 Parent Web Bootstrap

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  web-bootstrap:
    name: Next.js responsive shell - lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned dependencies
        run: npm ci --no-audit --no-fund
      - name: Static checks
        run: |
          npm run lint
          npm run typecheck
      - name: Production build
        run: npm run build
      - name: Responsive shell and HTTP regression
        run: npm test
