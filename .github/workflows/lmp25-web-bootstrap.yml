name: LMP-25 Temporary Lockfile Sync

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  sync-lockfile-once:
    if: github.event.pull_request.head.ref == 'feature/lmp-25-nextjs-bootstrap' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/lmp-25-nextjs-bootstrap
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Sync lockfile for actual ESLint dependencies
        working-directory: apps/web
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          if git diff --quiet -- package-lock.json; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m '[LMP-25] Sync ESLint dependency lockfile'
          git push origin HEAD:feature/lmp-25-nextjs-bootstrap
