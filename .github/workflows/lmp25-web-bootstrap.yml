name: LMP-25 Parent Web Bootstrap

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  web-bootstrap:
    name: Next.js responsive shell - lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
            echo "::warning::LMP-25: package-lock.json is missing; reproducible npm ci remains a release blocker"
          fi
      - name: Static checks
        run: |
          npm run lint
          npm run typecheck
      - name: Responsive shell regression
        run: npm test
      - name: Production build
        run: npm run build
