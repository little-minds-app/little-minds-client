name: Client CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  ci-smoke-test:
    name: CI Infrastructure Check
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify repository files
        run: |
          test -f README.md
          test -f .github/pull_request_template.md
          echo "Repository structure verified."

      - name: LMP-19 documentation structure checks
        run: |
          chmod +x scripts/check-lmp19-docs.sh
          ./scripts/check-lmp19-docs.sh

  contract-checks:
    name: OpenAPI Generated Clients
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install contract tooling
        run: npm ci

      - name: Validate, compatibility, generate, drift
        run: |
          chmod +x scripts/check-contracts.sh
          npm run contracts:check

      - name: Contract unit tests
        run: npm test

  detect-projects:
    name: Detect Client Projects
    runs-on: ubuntu-latest
    outputs:
      flutter: ${{ steps.detect.outputs.flutter }}
      nextjs: ${{ steps.detect.outputs.nextjs }}

    steps:
      - uses: actions/checkout@v4

      - name: Detect project manifests
        id: detect
        shell: bash
        run: |
          if [ -f apps/mobile/pubspec.yaml ]; then
            echo "flutter=true" >> "$GITHUB_OUTPUT"
          else
            echo "flutter=false" >> "$GITHUB_OUTPUT"
          fi

          if [ -f apps/web/package-lock.json ]; then
            echo "nextjs=true" >> "$GITHUB_OUTPUT"
          else
            echo "nextjs=false" >> "$GITHUB_OUTPUT"
          fi

  flutter-check:
    name: Flutter Analysis
    needs: detect-projects
    if: needs.detect-projects.outputs.flutter == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  nextjs-check:
    name: Next.js Build
    needs: detect-projects
    if: needs.detect-projects.outputs.nextjs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
