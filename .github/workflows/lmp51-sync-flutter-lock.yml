name: LMP-51 Sync Flutter Dependency Lock
on:
  push:
    branches:
      - feature/lmp-51-flutter-offline-outbox
    paths:
      - 'apps/mobile/pubspec.yaml'
      - '.github/workflows/lmp51-sync-flutter-lock.yml'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Resolve Flutter dependencies
        working-directory: apps/mobile
        run: flutter pub get
      - name: Commit reviewed lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile/pubspec.lock
          if ! git diff --cached --quiet; then
            git commit -m "[LMP-51] Lock cryptography dependency for AES-GCM outbox"
            git push origin HEAD:${{ github.ref_name }}
          fi
