name: LMP-51 Sync Generated Clients
on:
  push:
    branches:
      - feature/lmp-51-flutter-offline-outbox
    paths:
      - 'contracts/openapi.yaml'
      - 'contracts/VERSION'
      - 'contracts/pin.json'
      - 'contracts/compatibility/**'
      - '.github/workflows/lmp51-sync-generated.yml'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Generate pinned Dart and TypeScript API clients
        run: |
          npm ci
          npm run contracts:validate
          npm run contracts:compat
          npm run contracts:generate
      - name: Commit versioned client output for final review
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/
          if ! git diff --cached --quiet; then
            git commit -m "[LMP-51] Generate Flutter API client from backend v0.12.0 pin"
            git push origin HEAD:${{ github.ref_name }}
          fi
