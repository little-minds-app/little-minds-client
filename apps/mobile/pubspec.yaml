name: little_minds_mobile
description: Little Minds Kids App (Flutter + Flame). Child Hub v1 + Flame lifecycle (LMP-44) + Near/Far demo (LMP-45/46) + mentor card schema consumption (LMP-47).
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flame: ^1.38.2
  flutter_secure_storage: ^9.2.4
  intl: any
  little_minds_api:
    path: ../../generated/dart
  shared_preferences: ^2.5.6
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/audio/hub/
    - assets/audio/near_far/
    - assets/content/mentor_cards/
