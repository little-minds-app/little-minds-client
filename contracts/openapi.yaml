  /v1/auth/phone/start:
    post:
      operationId: startPhoneOtp
      tags: [Auth]
      summary: Start GSM OTP challenge (ADR-020)
      description: |
        Unauthenticated. Türkiye (+90) only Day-1. Requires uniform
        `notice_version` + `notice_locale` (KVKK Option A). Never returns OTP.
        Anti-enumeration: response shape identical for existing vs new parents.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhoneOtpStartRequest'
      responses:
        '200':
          description: Challenge issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhoneOtpStartResponse'
        '400':
          description: Malformed phone or invalid notice presentation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'
        '429':
          description: Cooldown or rate limited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'
        '503':
          description: SMS unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'
  /v1/auth/phone/verify:
    post:
      operationId: verifyPhoneOtp
      tags: [Auth]
      summary: Verify GSM OTP and mint parent session (ADR-020)
      description: |
        Uniform for existing and new parents (U7 Option A creates parent on first
        success). No privacy fields on verify — notice bound at start. Returns
        ADR-019 TokenPairResponse via SessionIssuerService.mintSessionTx.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhoneOtpVerifyRequest'
      responses:
        '200':
          description: Token pair
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPairResponse'
        '400':
          description: Malformed body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'
        '401':
          description: Invalid or expired OTP
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'
        '403':
          description: Session limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'
        '429':
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'
  /v1/auth/oidc/nonce:
    post:
      operationId: issueOidcNonce
      tags: [Auth]
      summary: Issue short-lived OIDC nonce (ADR-021)
      description: |
        Unauthenticated. Returns a **provider-bound** server-issued nonce for Apple
        or Google ID-token paths (`provider` required: apple|google). Single-use;
        TTL 600s. Rate-limited per IP. Cross-provider consume is rejected.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OidcNonceRequest'
      responses:
        '200':
          description: Nonce issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OidcNonceResponse'
        '400':
          description: Missing or invalid provider
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'
        '429':
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'
  /v1/auth/google/pkce/start:
    post:
      operationId: startGooglePkce
      tags: [Auth]
      summary: Issue one-time Google PKCE OAuth transaction/state (ADR-021)
      description: |
        Unauthenticated. Returns a server-issued opaque `state` bound to allowlisted
        `client_id`, `redirect_uri`, and PKCE `code_challenge` (S256). Single-use;
        TTL 600s. Required before `POST /v1/auth/google` authorization-code path
        (`oauth_state`). Fail-closed when PKCE disabled / Google misconfigured.
        Rate-limited per IP.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GooglePkceStartRequest'
      responses:
        '200':
          description: OAuth transaction started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GooglePkceStartResponse'
        '400':
          description: Invalid redirect / challenge / client_id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'
        '401':
          description: PKCE disabled or Google misconfigured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'
        '429':
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'
  /v1/auth/apple:
    post:
      operationId: authenticateApple
      tags: [Auth]
      summary: Apple Sign In with JWKS + mandatory nonce (ADR-021)
      description: |
        Verifies Apple ID token via JWKS (asymmetric), issuer/audience/exp/iat/sub,
        and mandatory single-use server nonce. U7 Option A creates parent on first
        success via mintSessionTx. Never trusts client-supplied Apple user id/email/name.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppleAuthRequest'
      responses:
        '200':
          description: Token pair
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPairResponse'
        '400':
          description: Malformed body or invalid notice
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'
        '401':
          description: Invalid token / nonce / replay
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'
        '403':
          description: Session limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'
  /v1/auth/google:
    post:
      operationId: authenticateGoogle
      tags: [Auth]
      summary: Google Sign-In nonce or auth-code+PKCE (ADR-021)
      description: |
        Prefer ID token + mandatory nonce. Else authorization_code + code_verifier
        + redirect_uri + **oauth_state** (from `POST /v1/auth/google/pkce/start`) —
        server atomically consumes the PKCE transaction, exchanges the code, then
        JWKS-verifies. Never accepts ID-token-without-nonce or unbound auth-code
        exchange. Fail-closed when Google config / PKCE disabled.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleAuthRequest'
      responses:
        '200':
          description: Token pair
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPairResponse'
        '400':
          description: Malformed body / neither path satisfiable / invalid notice
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'
        '401':
          description: Invalid token / nonce / PKCE state / replay
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'
        '403':
          description: Session limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'
  /v1/auth/email/start:
    post:
      operationId: startEmailOtp
      tags: [Auth]
      summary: Start Email OTP challenge (ADR-021)
      description: |
        Unauthenticated. Applies email_norm_v1. Requires notice_version +
        notice_locale (KVKK Option A). Never returns OTP. deliveryState=sent
        required before verify.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailOtpStartRequest'
      responses:
        '200':
          description: Challenge issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailOtpStartResponse'
        '400':
          description: email_norm_v1 reject or invalid notice
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'
        '429':
          description: Cooldown or rate limited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'
        '503':
          description: Mail unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'
  /v1/auth/email/verify:
    post:
      operationId: verifyEmailOtp
      tags: [Auth]
      summary: Verify Email OTP and mint parent session (ADR-021)
      description: |
        Gate: status=pending and deliveryState=sent. U7 Option A creates parent
        on first success. No privacy fields on verify. No silent email link (LMP-36).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailOtpVerifyRequest'
      responses:
        '200':
          description: Token pair
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPairResponse'
        '400':
          description: Malformed body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'
        '401':
          description: Invalid or expired OTP / not durable-sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'
        '403':
          description: Session limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'
        '429':
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'
  /v1/auth/identities/step-up:
    post:
      operationId: createIdentityLinkStepUp
      tags: [Auth]
      summary: Issue recent-auth step-up token for identity linking (LMP-36)
      description: |
        Authenticated parent proves control of an identity **already linked**
        to their account (Apple/Google/email/phone proof). Server returns a
        short-lived opaque `step_up_token` bound to parent + session + purpose
        `identity_link`. Access-token refresh alone is **not** recent auth.
        Token is single-use; stale/replayed/cross-parent consume fails closed.
      security:
        - parentAccessToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StepUpRequest'
      responses:
        '200':
          description: Step-up token issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StepUpResponse'
        '400':
          description: Malformed body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'
        '401':
          description: Missing/invalid session or existing-identity proof
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'
        '429':
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'
  /v1/auth/identities/link:
    post:
      operationId: linkParentIdentity
      tags: [Auth]
      summary: Explicitly link a verified provider identity (LMP-36)
      description: |
        Authenticated parent links another provider after **server-issued step-up**
        (`step_up_token` from `POST /v1/auth/identities/step-up`) **and** fresh
        target-provider proof (Apple/Google ID-token or PKCE, or email/phone OTP).
        Access-token refresh alone is not recent auth. No silent merge and no
        email/name/phone inference. On collision returns `409 identity_collision`
        without disclosing the other family. Unlink/recovery deferred.
      security:
        - parentAccessToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LinkIdentityRequest'
      responses:
        '200':
          description: Identity linked (or already linked to this parent)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LinkIdentityResponse'
        '400':
          description: Malformed body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'
        '401':
          description: Missing/invalid session or provider proof
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'
        '409':
          description: Identity collision (halt; no merge)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'
        '429':
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'
  /v1/auth/dev/session:
    post:
      operationId: createDevParentSession
      tags: [Auth]
      summary: Local/test session bootstrap (development only)
      description: |
        Hard-disabled in staging/production. Requires AUTH_DEV_BOOTSTRAP_ENABLED,
        allowlisted parent_id (default seed parent), and loopback client.
        Do not call from staging/production clients.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DevSessionRequest'
      responses:
        '200':
          description: Token pair
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPairResponse'
        '403':
          description: Bootstrap disabled or session limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'
        '404':
          description: Parent not allowlisted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'
        '429':
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'
components:
  securitySchemes:
    parentAccessToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Parent access JWT (Ed25519 / EdDSA, token_use=access, aud=little-minds-parent, TTL 900s).
        Server always loads parent_sessions by sid so revoke is immediate.
  schemas:
    ParentGateStatus:
      type: object
      required: [configured]
      properties:
        configured: { type: boolean }
    ParentGateProofRequest:
      type: object
      required: [provider]
      properties:
        provider: { type: string, enum: [phone, email, apple, google] }
        challenge_id: { type: string }
        code: { type: string, minLength: 6, maxLength: 6 }
        id_token: { type: string }
        nonce: { type: string }
        authorization_code: { type: string }
        code_verifier: { type: string }
        redirect_uri: { type: string }
        oauth_state: { type: string }
    ParentGateProofResponse:
      type: object
      required: [step_up_token, purpose, expires_in]
      properties:
        step_up_token: { type: string }
        purpose: { type: string, enum: [parent_gate_pin] }
        expires_in: { type: integer }
    ParentGateSetPinRequest:
      type: object
      required: [pin, confirmation, step_up_token]
      properties:
        pin: { type: string, minLength: 6, maxLength: 6 }
        confirmation: { type: string, minLength: 6, maxLength: 6 }
        step_up_token: { type: string }
    ParentGateVerifyRequest:
      type: object
      required: [pin]
      properties:
        pin: { type: string, minLength: 6, maxLength: 6 }
    ParentGateVerifyResponse:
      type: object
      required: [gate_token, expires_in]
      properties:
        gate_token: { type: string }
        expires_in: { type: integer }
    ParentGateAuthorized:
      type: object
      required: [authorized]
      properties:
        authorized: { type: boolean }
    ParentGateLocked:
      type: object
      required: [locked]
      properties:
        locked: { type: boolean }
    OptionalParentProfile:
      type: object
      additionalProperties: false
      required: [first_name, last_name, age_band_optional, gender_optional, number_of_children_optional, occupation_optional]
      properties:
        first_name: { type: string, nullable: true, maxLength: 100 }
        last_name: { type: string, nullable: true, maxLength: 100 }
        age_band_optional:
          type: string
          nullable: true
          enum: ['18-24', '25-34', '35-44', '45-54', '55+', prefer_not_to_say, null]
        gender_optional:
          type: string
          nullable: true
          enum: [woman, man, non_binary, self_describe, prefer_not_to_say, null]
        number_of_children_optional: { type: integer, nullable: true, minimum: 0, maximum: 30 }
        occupation_optional:
          type: string
          nullable: true
          enum: [education, healthcare, technology, finance_business, public_service, retail_services, manufacturing_trades, creative_media, homemaker_caregiver, student, retired, not_currently_employed, other, prefer_not_to_say, null]
    UpdateOptionalParentProfile:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        first_name: { type: string, nullable: true, maxLength: 100 }
        last_name: { type: string, nullable: true, maxLength: 100 }
        age_band_optional:
          type: string
          nullable: true
          enum: ['18-24', '25-34', '35-44', '45-54', '55+', prefer_not_to_say, null]
        gender_optional:
          type: string
          nullable: true
          enum: [woman, man, non_binary, self_describe, prefer_not_to_say, null]
        number_of_children_optional: { type: integer, nullable: true, minimum: 0, maximum: 30 }
        occupation_optional:
          type: string
          nullable: true
          enum: [education, healthcare, technology, finance_business, public_service, retail_services, manufacturing_trades, creative_media, homemaker_caregiver, student, retired, not_currently_employed, other, prefer_not_to_say, null]
    ChildProfileResponse:
      type: object
      additionalProperties: false
      required: [child_id, nickname, age_months, preferred_locale]
      properties:
        child_id:
          type: string
          format: uuid
        nickname:
          type: string
          nullable: true
        age_months:
          type: integer
          format: int32
        preferred_locale:
          type: string
    DeviceActiveChildBinding:
      type: object
      additionalProperties: false
      required: [device_id, installation_id, child_id, binding_revision, updated_at]
      properties:
        device_id:
          type: string
          format: uuid
          description: Parent-scoped database devices.id (server-derived)
        installation_id:
          type: string
          format: uuid
          description: Client installation UUID echoed for correlation
        child_id:
          type: string
          format: uuid
          nullable: true
          description: Active child authorized for ingest on this device; null when unassigned
        binding_revision:
          type: integer
          format: int32
          minimum: 0
          description: Server-authoritative monotonic revision; send as expected_binding_revision on PUT
        updated_at:
          type: string
          format: date-time
          description: UTC timestamp of the last binding mutation
    HealthStatus:
      type: object
      additionalProperties: false
      required:
        - status
        - service
        - timestamp
      properties:
        status:
          type: string
          enum:
            - ok
          description: Liveness indicator
        service:
          type: string
          enum:
            - little-minds-backend
          description: Stable service identifier
        timestamp:
          type: string
          format: date-time
          description: UTC ISO-8601 timestamp when the check was produced
    ReadinessStatus:
      type: object
      additionalProperties: false
      required:
        - status
        - service
        - timestamp
        - checks
      properties:
        status:
          type: string
          enum:
            - ok
            - not_ready
          description: Readiness indicator (not_ready → HTTP 503)
        service:
          type: string
          enum:
            - little-minds-backend
          description: Stable service identifier
        timestamp:
          type: string
          format: date-time
          description: UTC ISO-8601 timestamp when the check was produced
        checks:
          type: object
          additionalProperties: false
          required:
            - database
          properties:
            database:
              type: string
              enum:
                - up
                - down
                - skipped
              description: |
                PostgreSQL probe result. `skipped` only when APP_ENV=development
                and DATABASE_URL is unset. Staging/production missing DATABASE_URL
                or a failed probe → `down` (forces overall not_ready).
    RefreshTokenRequest:
      type: object
      additionalProperties: false
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
          minLength: 16
    LogoutRequest:
      type: object
      additionalProperties: false
      properties:
        refresh_token:
          type: string
          minLength: 16
    TokenPairResponse:
      type: object
      additionalProperties: false
      required:
        - access_token
        - refresh_token
        - token_type
        - expires_in
        - session_id
        - parent_id
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        token_type:
          type: string
          enum: [Bearer]
        expires_in:
          type: integer
          enum: [900]
        session_id:
          $ref: '#/components/schemas/UuidV4OrV7'
        parent_id:
          $ref: '#/components/schemas/UuidV4OrV7'
    LogoutAllResponse:
      type: object
      additionalProperties: false
      required: [revoked_session_count]
      properties:
        revoked_session_count:
          type: integer
          minimum: 0


    StepUpRequest:
      type: object
      additionalProperties: false
      required: [provider]
      properties:
        provider:
          type: string
          enum: [apple, google, email, phone]
          description: Existing linked provider to re-prove for recent auth
        id_token:
          type: string
          minLength: 20
          maxLength: 8192
        nonce:
          type: string
          minLength: 8
          maxLength: 128
        authorization_code:
          type: string
          minLength: 8
          maxLength: 2048
        code_verifier:
          type: string
          minLength: 43
          maxLength: 128
        redirect_uri:
          type: string
          maxLength: 2048
        oauth_state:
          type: string
          minLength: 8
          maxLength: 256
        challenge_id:
          type: string
          format: uuid
        code:
          type: string
          pattern: '^[0-9]{6}$'
    StepUpResponse:
      type: object
      additionalProperties: false
      required: [step_up_token, expires_in, purpose]
      properties:
        step_up_token:
          type: string
          description: Opaque one-time token; present on link within TTL
        expires_in:
          type: integer
          enum: [300]
        purpose:
          type: string
          enum: [identity_link]

    LinkIdentityRequest:
      type: object
      additionalProperties: false
      required: [step_up_token, provider]
      properties:
        step_up_token:
          type: string
          minLength: 16
          maxLength: 256
          description: Opaque one-time token from POST /v1/auth/identities/step-up
        provider:
          type: string
          enum: [apple, google, email, phone]
          description: Provider to link; proof fields must match provider
        id_token:
          type: string
          minLength: 20
          maxLength: 8192
          description: Apple or Google ID token (nonce path)
        nonce:
          type: string
          minLength: 8
          maxLength: 128
          description: Server-issued nonce (Apple/Google nonce path)
        authorization_code:
          type: string
          minLength: 8
          maxLength: 2048
          description: Google authorization code (PKCE path)
        code_verifier:
          type: string
          minLength: 43
          maxLength: 128
        redirect_uri:
          type: string
          maxLength: 2048
        oauth_state:
          type: string
          minLength: 8
          maxLength: 256
          description: Server-issued oauth_state from google/pkce/start
        challenge_id:
          type: string
          format: uuid
          description: Email or phone OTP challenge id
        code:
          type: string
          pattern: '^[0-9]{6}$'
          description: Email or phone OTP code
    LinkIdentityResponse:
      type: object
      additionalProperties: false
      required: [parent_id, provider, identity_id, linked_at, already_linked]
      properties:
        parent_id:
          type: string
          format: uuid
        provider:
          type: string
          enum: [apple, google, email, phone]
        identity_id:
          type: string
          format: uuid
        linked_at:
          type: string
          format: date-time
        already_linked:
          type: boolean
          description: True when subject was already linked to this parent (idempotent)

    AuthError:
      type: object
      additionalProperties: false
      required: [error, message]
      properties:
        error:
          type: string
          enum:
            - invalid_request
            - invalid_token
            - expired_token
            - revoked_session
            - refresh_reuse
            - rate_limited
            - session_limit_exceeded
            - bootstrap_disabled
            - otp_invalid
            - otp_cooldown
            - sms_unavailable
            - mail_unavailable
            - identity_collision
        message:
          type: string
    OidcNonceRequest:
      type: object
      additionalProperties: false
      required: [provider]
      properties:
        provider:
          type: string
          enum: [apple, google]
          description: Provider binding; cross-provider consume is rejected
    OidcNonceResponse:
      type: object
      additionalProperties: false
      required: [nonce, expires_in]
      properties:
        nonce:
          type: string
          minLength: 8
          maxLength: 128
        expires_in:
          type: integer
          enum: [600]
    GooglePkceStartRequest:
      type: object
      additionalProperties: false
      required: [redirect_uri, code_challenge]
      properties:
        redirect_uri:
          type: string
          maxLength: 2048
          description: Must be in GOOGLE_REDIRECT_URIS allowlist
        code_challenge:
          type: string
          minLength: 43
          maxLength: 128
          description: S256 code_challenge (base64url SHA-256 of verifier)
        code_challenge_method:
          type: string
          enum: [S256]
          description: Only S256 is accepted; defaults to S256
        client_id:
          type: string
          maxLength: 256
          description: Optional; must be in GOOGLE_CLIENT_IDS when provided
    GooglePkceStartResponse:
      type: object
      additionalProperties: false
      required: [state, expires_in, client_id]
      properties:
        state:
          type: string
          minLength: 8
          maxLength: 128
          description: Opaque one-time oauth_state for POST /v1/auth/google
        expires_in:
          type: integer
          enum: [600]
        client_id:
          type: string
          description: Bound Google OAuth client_id for this transaction
    AppleAuthRequest:
      type: object
      additionalProperties: false
      required: [id_token, nonce, notice_version, notice_locale]
      properties:
        id_token:
          type: string
          minLength: 20
          maxLength: 8192
        nonce:
          type: string
          minLength: 8
          maxLength: 128
        notice_version:
          type: string
          maxLength: 64
        notice_locale:
          type: string
          maxLength: 16
        client_surface:
          type: string
          maxLength: 32
        device_id:
          $ref: '#/components/schemas/UuidV4OrV7'
    GoogleAuthRequest:
      type: object
      additionalProperties: false
      required: [notice_version, notice_locale]
      description: |
        Provide either (id_token + nonce) OR (authorization_code + code_verifier
        + redirect_uri + oauth_state from pkce/start). ID token without nonce
        and authorization_code without oauth_state are rejected.
      properties:
        id_token:
          type: string
          minLength: 20
          maxLength: 8192
        nonce:
          type: string
          minLength: 8
          maxLength: 128
        authorization_code:
          type: string
          minLength: 8
          maxLength: 2048
        code_verifier:
          type: string
          minLength: 43
          maxLength: 128
        redirect_uri:
          type: string
          maxLength: 2048
        oauth_state:
          type: string
          minLength: 8
          maxLength: 128
          description: Server-issued state from POST /v1/auth/google/pkce/start
        notice_version:
          type: string
          maxLength: 64
        notice_locale:
          type: string
          maxLength: 16
        client_surface:
          type: string
          maxLength: 32
        device_id:
          $ref: '#/components/schemas/UuidV4OrV7'
    EmailOtpStartRequest:
      type: object
      additionalProperties: false
      required: [email, notice_version, notice_locale]
      properties:
        email:
          type: string
          maxLength: 320
        notice_version:
          type: string
          maxLength: 64
        notice_locale:
          type: string
          maxLength: 16
        client_surface:
          type: string
          maxLength: 32
    EmailOtpStartResponse:
      type: object
      additionalProperties: false
      required: [challenge_id, expires_in, resend_after]
      properties:
        challenge_id:
          $ref: '#/components/schemas/UuidV4OrV7'
        expires_in:
          type: integer
          enum: [600]
        resend_after:
          type: integer
          enum: [60]
    EmailOtpVerifyRequest:
      type: object
      additionalProperties: false
      required: [challenge_id, code]
      properties:
        challenge_id:
          $ref: '#/components/schemas/UuidV4OrV7'
        code:
          type: string
          pattern: '^[0-9]{6}$'
        client_surface:
          type: string
          maxLength: 32
        device_id:
          $ref: '#/components/schemas/UuidV4OrV7'
    PhoneOtpStartRequest:
      type: object
      additionalProperties: false
      required: [phone, notice_version, notice_locale]
      properties:
        phone:
          type: string
          minLength: 5
          maxLength: 32
        country_code:
          type: string
          maxLength: 8
        notice_version:
          type: string
          maxLength: 64
          description: |
            KVKK Option A — uniform for ALL callers. Must equal server active
            published notice version. Not consent. Not required on verify.
        notice_locale:
          type: string
          maxLength: 16
        client_surface:
          type: string
          maxLength: 32
        device_id:
          $ref: '#/components/schemas/UuidV4OrV7'
    PhoneOtpStartResponse:
      type: object
      additionalProperties: false
      required: [challenge_id, expires_in, resend_after]
      properties:
        challenge_id:
          $ref: '#/components/schemas/UuidV4OrV7'
        expires_in:
          type: integer
          enum: [300]
        resend_after:
          type: integer
          enum: [60]
    PhoneOtpVerifyRequest:
      type: object
      additionalProperties: false
      required: [challenge_id, code]
      properties:
        challenge_id:
          $ref: '#/components/schemas/UuidV4OrV7'
        code:
          type: string
          pattern: '^[0-9]{6}$'
        client_surface:
          type: string
          maxLength: 32
        device_id:
          $ref: '#/components/schemas/UuidV4OrV7'
    ParentSessionSummary:
      type: object
      additionalProperties: false
      required: [session_id, created_at, expires_at, revoked]
      properties:
        session_id:
          $ref: '#/components/schemas/UuidV4OrV7'
        created_at:
          type: string
          format: date-time
        last_refreshed_at:
          type: string
          format: date-time
          nullable: true
        expires_at:
          type: string
          format: date-time
        revoked:
          type: boolean
        client_surface:
          type: string
          nullable: true
        device_id:
          $ref: '#/components/schemas/UuidV4OrV7'
          nullable: true
        user_agent_summary:
          type: string
          nullable: true
          maxLength: 128
    ParentSessionListResponse:
      type: object
      additionalProperties: false
      required: [sessions]
      properties:
        sessions:
          type: array
          items:
            $ref: '#/components/schemas/ParentSessionSummary'
    ParentMeResponse:
      type: object
      additionalProperties: false
      required: [parent_id, locale, timezone, lifecycle]
      properties:
        parent_id:
          $ref: '#/components/schemas/UuidV4OrV7'
        locale:
          type: string
        timezone:
          type: string
        lifecycle:
          type: string
          enum: [active, pending_deletion, deleted]
    DevSessionRequest:
      type: object
      additionalProperties: false
      required: [parent_id]
      properties:
        parent_id:
          $ref: '#/components/schemas/UuidV4OrV7'
        client_surface:
          type: string
          enum: [ios, android, web, unknown]
        device_id:
          $ref: '#/components/schemas/UuidV4OrV7'
    ActivitySchemaVersion:
      type: string
      enum:
        - '1.0.0'
      description: |
        Product event/session schema semver. Independent from OpenAPI info.version.
    UuidV4OrV7:
      type: string
      pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[457][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$'
      description: |
        RFC 4122 UUID with version nibble 4, 5, or 7. UUIDv5 is used for
        parent-scoped `devices.id` digests on activity ingest (LMP-134).
    UtcInstantZ:
      type: string
      pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]{1,9})?Z$'
      description: UTC ISO-8601 instant ending in Z
    EffectiveConsentScope:
      type: object
      additionalProperties: false
      required:
        - consent_scope
        - child_id
        - authorized
        - policy_version
        - status
        - effective_at
        - source
        - record_id
      properties:
        consent_scope:
          $ref: '#/components/schemas/ConsentScope'
        child_id:
          allOf:
            - $ref: '#/components/schemas/UuidV4OrV7'
          nullable: true
        authorized:
          type: boolean
          description: True when latest-effective trusted records grant the scope
        policy_version:
          type: string
          nullable: true
        status:
          type: string
          enum: [granted, withdrawn, not_granted]
        effective_at:
          allOf:
            - $ref: '#/components/schemas/UtcInstantZ'
          nullable: true
        source:
          type: string
          enum: [server_consent_store]
          nullable: true
        record_id:
          allOf:
            - $ref: '#/components/schemas/UuidV4OrV7'
          nullable: true
    EffectiveConsentScopesResponse:
      type: object
      additionalProperties: false
      required: [scopes]
      properties:
        scopes:
          type: array
          items:
            $ref: '#/components/schemas/EffectiveConsentScope'
    ConsentScopeMutationRequest:
      type: object
      additionalProperties: false
      required: [consent_scope, policy_version]
      properties:
        consent_scope:
          $ref: '#/components/schemas/ConsentScope'
        policy_version:
          type: string
          minLength: 1
          description: Published policy version for this scope (e.g. synthetic-policy-v1)
        child_id:
          allOf:
            - $ref: '#/components/schemas/UuidV4OrV7'
          nullable: true
          description: Omit or null for parent-level scope; set for child-scoped consent row
    ConsentScopeMutationResponse:
      type: object
      additionalProperties: false
      required:
        - record_id
        - consent_scope
        - child_id
        - policy_version
        - status
        - recorded_at
        - source
      properties:
        record_id:
          $ref: '#/components/schemas/UuidV4OrV7'
        consent_scope:
          $ref: '#/components/schemas/ConsentScope'
        child_id:
          allOf:
            - $ref: '#/components/schemas/UuidV4OrV7'
          nullable: true
        policy_version:
          type: string
        status:
          type: string
          enum: [granted, withdrawn]
        recorded_at:
          $ref: '#/components/schemas/UtcInstantZ'
        source:
          type: string
          enum: [server_consent_store]
    ConsentScope:
      type: string
      enum:
        - essential_play_events
        - essential_service_telemetry
        - optional_product_analytics
      description: Purpose-specific consent scope (draft placeholders until legal sign-off)
    ActivityEventType:
      type: string
      enum:
        - activity_started
        - activity_attempted
        - activity_hint_used
        - activity_completed
        - activity_abandoned
        - child_mode_foreground_started
        - child_mode_foreground_ended
        - real_world_mission_offered
        - real_world_mission_opened
        - mission_feedback_submitted
        - mentor_card_opened
        - screen_limit_reached
        - content_pack_downloaded
      description: Blueprint §14.1 allowlist
    ActivitySessionConsent:
      type: object
      additionalProperties: false
      required:
        - purpose
        - policy_version
        - consent_scope
        - decision
      properties:
        purpose:
          type: string
          enum:
            - essential_service_telemetry
            - essential_play_events
            - optional_product_analytics
        policy_version:
          type: string
        consent_scope:
          $ref: '#/components/schemas/ConsentScope'
        decision:
          type: string
          enum:
            - granted
            - denied
            - withdrawn
          description: Client UX evidence only — never treated as server authorization
    ActivitySessionProvenance:
      type: object
      additionalProperties: false
      required:
        - emitter
        - capture_channel
        - clock_trust
      properties:
        emitter:
          type: string
          enum:
            - kids_mode_client
            - parent_dashboard
            - sync_worker
        capture_channel:
          type: string
          enum:
            - offline_queue
            - online_direct
            - replay_backfill
        clock_trust:
          type: string
          enum:
            - monotonic_within_boot
            - wall_clock_only
            - unknown
    ActivityEventProvenance:
      type: object
      additionalProperties: false
      required:
        - emitter
        - actor_scope
        - source
        - clock_trust
      properties:
        emitter:
          type: string
          enum:
            - kids_mode_client
            - parent_dashboard
            - sync_worker
        actor_scope:
          type: string
          enum:
            - child_play
            - parent
        source:
          type: string
          enum:
            - instrumented
            - caregiver_report
        clock_trust:
          type: string
          enum:
            - monotonic_within_boot
            - wall_clock_only
            - unknown
    ActivitySessionV1:
      type: object
      additionalProperties: false
      description: |
        Versioned activity session wire document. Client MUST NOT send child_id or received_at.
        Full validation rules: contracts/schemas/activity/activity-session-v1.schema.json
      required:
        - schema_version
        - play_session_id
        - device_id
        - content_version_id
        - started_at
        - completion_status
        - consent
        - provenance
      properties:
        schema_version:
          $ref: '#/components/schemas/ActivitySchemaVersion'
        play_session_id:
          $ref: '#/components/schemas/UuidV4OrV7'
        device_id:
          $ref: '#/components/schemas/UuidV4OrV7'
        content_version_id:
          $ref: '#/components/schemas/UuidV4OrV7'
        started_at:
          $ref: '#/components/schemas/UtcInstantZ'
        ended_at:
          $ref: '#/components/schemas/UtcInstantZ'
        monotonic_duration_seconds:
          type: integer
          minimum: 0
          maximum: 86400
        completion_status:
          type: string
          enum:
            - started
            - completed
            - abandoned
            - interrupted
        app_build:
          type: string
        locale:
          type: string
          pattern: '^[a-z]{2}-[A-Z]{2}$'
        consent:
          $ref: '#/components/schemas/ActivitySessionConsent'
        provenance:
          $ref: '#/components/schemas/ActivitySessionProvenance'
    ActivityEventV1:
      type: object
      additionalProperties: false
      description: |
        Versioned activity event envelope (§14.1 + §38.4). Rejects client received_at / child_id.
        Parent-only events omit play_session_id. Per-type payloads enforced by JSON Schema.
        Full validation: contracts/schemas/activity/activity-event-v1.schema.json
      required:
        - schema_version
        - event_id
        - event_type
        - device_id
        - content_version_id
        - occurred_at
        - consent_scope
        - consent_policy_version
        - provenance
        - payload
      properties:
        schema_version:
          $ref: '#/components/schemas/ActivitySchemaVersion'
        event_id:
          $ref: '#/components/schemas/UuidV4OrV7'
        event_type:
          $ref: '#/components/schemas/ActivityEventType'
        play_session_id:
          $ref: '#/components/schemas/UuidV4OrV7'
          description: Required for child_play; omit for parent-only events
        device_id:
          $ref: '#/components/schemas/UuidV4OrV7'
        content_version_id:
          $ref: '#/components/schemas/UuidV4OrV7'
        occurred_at:
          $ref: '#/components/schemas/UtcInstantZ'
        monotonic_duration_seconds:
          type: integer
          minimum: 0
          maximum: 86400
        consent_scope:
          $ref: '#/components/schemas/ConsentScope'
        consent_policy_version:
          type: string
        provenance:
          $ref: '#/components/schemas/ActivityEventProvenance'
        payload:
          type: object
          additionalProperties: true
          description: Typed allowlisted payload per event_type (see JSON Schema)
    SessionKpiRateMetric:
      type: object
      additionalProperties: false
      required: [availability_status, numerator, denominator]
      properties:
        availability_status:
          type: string
          enum: [available, unavailable]
        value:
          type: number
          minimum: 0
          maximum: 1
        reason_code:
          type: string
        numerator:
          type: integer
          minimum: 0
        denominator:
          type: integer
          minimum: 0
    SessionKpiActivityBreakdown:
      type: object
      additionalProperties: false
      required: [content_version_id, session_starts, completed_sessions, play_duration_seconds]
      properties:
        content_version_id:
          type: string
          format: uuid
        session_starts:
          type: integer
          minimum: 0
        completed_sessions:
          type: integer
          minimum: 0
        play_duration_seconds:
          type: integer
          minimum: 0
    SessionKpiResponse:
      type: object
      additionalProperties: false
      required:
        - definition_version
        - source
        - generated_at
        - window
        - freshness
        - sample
        - metrics
      properties:
        definition_version:
          type: string
          example: session-kpi-v1
        source:
          type: string
          enum: [server_activity_sessions]
        generated_at:
          type: string
          format: date-time
        latest_ingested_at:
          type: string
          format: date-time
          nullable: true
        latest_activity_at:
          type: string
          format: date-time
          nullable: true
        window:
          type: object
          additionalProperties: false
          required: [from, to, timezone, bounds]
          properties:
            from:
              type: string
              format: date-time
            to:
              type: string
              format: date-time
            timezone:
              type: string
            bounds:
              type: string
              enum: [half_open_started_at]
        freshness:
          type: object
          additionalProperties: false
          required: [status, stale_threshold_seconds, data_completeness]
          properties:
            status:
              type: string
              enum: [fresh, stale, no_data, unknown]
            stale_threshold_seconds:
              type: integer
              minimum: 1
            data_completeness:
              type: string
              enum: [complete, partial, unknown]
        sample:
          type: object
          additionalProperties: false
          required:
            - eligible_sessions
            - terminal_sessions
            - excluded_unsupported_schema
            - excluded_consent
          properties:
            eligible_sessions:
              type: integer
              minimum: 0
            terminal_sessions:
              type: integer
              minimum: 0
            excluded_unsupported_schema:
              type: integer
              minimum: 0
            excluded_consent:
              type: integer
              minimum: 0
        metrics:
          type: object
          additionalProperties: false
          required:
            - eligible_session_count
            - completed_session_count
            - interrupted_session_count
            - abandoned_session_count
            - in_progress_session_count
            - total_play_duration_seconds
            - completed_session_rate
            - distinct_play_days
            - by_activity
            - first_attempt_accuracy
          properties:
            eligible_session_count:
              type: integer
              minimum: 0
            completed_session_count:
              type: integer
              minimum: 0
            interrupted_session_count:
              type: integer
              minimum: 0
            abandoned_session_count:
              type: integer
              minimum: 0
            in_progress_session_count:
              type: integer
              minimum: 0
            total_play_duration_seconds:
              type: integer
              minimum: 0
            completed_session_rate:
              $ref: '#/components/schemas/SessionKpiRateMetric'
            distinct_play_days:
              type: integer
              minimum: 0
            by_activity:
              type: array
              items:
                $ref: '#/components/schemas/SessionKpiActivityBreakdown'
            first_attempt_accuracy:
              $ref: '#/components/schemas/SessionKpiRateMetric'
