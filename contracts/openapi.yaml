openapi: 3.0.3
info:
  title: Little Minds Backend API
  description: |
    Authoritative OpenAPI contract for little-minds-backend (ADR-014).
    Paths: health/readiness, LMP-33 parent session lifecycle, LMP-34 GSM OTP
    (`POST /v1/auth/phone/start|verify` per ADR-020), LMP-35 multi-provider
    auth (`POST /v1/auth/apple|google|google/pkce/start|oidc/nonce|email/start|email/verify`
    per ADR-021), and LMP-36 explicit identity linking (`POST /v1/auth/identities/step-up|link`).
    LMP-32 adds structured logging / correlation (not path surface) plus
    readiness. LMP-50 adds ActivitySessionV1 / ActivityEventV1 **components** for versioned
    event contracts. LMP-51 adds authenticated, server-consent-gated
    POST /v1/events/batch with per-event durable acknowledgements. LMP-52 adds authenticated
    GET /v1/insights/session-kpis for canonical session KPI aggregation and freshness metadata.
    LMP-130 adds parent-scoped mission status reads and caregiver-reported feedback writes
    (`GET /v1/children/{childId}/missions` requires bounded `from`/`to`, `POST …/feedback`).
    LMP-54 adds passive BFF dashboard reads (`GET /v1/web/insights/session-kpis`,
    `GET /v1/web/children/{childId}/missions`) using opaque web session headers.
    LMP-134 adds parent-scoped device active-child bind/read
    (`GET|PUT /v1/devices/{installationId}/active-child`) for production play telemetry gates,
    and authenticated server consent grant/withdraw/read
    (`GET /v1/privacy/consent/effective`, `POST …/grant`, `POST …/withdraw`) backed by
    `consent_records` (`source: server_consent_store`).
    Authoritative Ajv JSON Schemas live under `contracts/schemas/activity/` (`schema_version` 1.0.0,
    independent of this info.version).
  version: 0.14.5

  contact:
    name: Little Minds
servers:
  - url: http://localhost:3000
    description: Local NestJS (default PORT)
tags:
  - name: Health
    description: Unauthenticated liveness and readiness (alert-ready signals; no paid vendors)
  - name: Auth
    description: |
      Parent session lifecycle (ADR-019 / LMP-33), GSM OTP (ADR-020 / LMP-34),
      Apple / Google / Email OTP (ADR-021 / LMP-35), and explicit linking (LMP-36)
  - name: Parent
    description: Authenticated parent identity probe
  - name: Insights
    description: Canonical server-side KPI reads (F-013)
  - name: Missions
    description: Parent-scoped real-world mission status (LMP-130 foundation)
  - name: Devices
    description: Parent-scoped installation device registration and active-child binding (LMP-134)
  - name: Privacy
    description: Authenticated parent consent store and effective-scope reads (LMP-134 / F-033)
paths:
  /v1/events/batch:
    post:
      operationId: ingestActivityEventBatch
      tags: [Activity]
      summary: Ingest a bounded batch of authenticated parent-owned activity sessions and events
      description: |
        LMP-51 contract only until backend implementation is enabled. Validate all
        items against canonical ActivitySessionV1 / ActivityEventV1 schemas, derive
        parent ownership from bearer, check authoritative server consent, and use
        transactionally global event_id idempotency across actor scopes.
        Parent-only events MUST omit play_session_id; no fabricated session.
      security:
        - parentAccessToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [sessions, events]
              properties:
                sessions:
                  type: array
                  maxItems: 50
                  items:
                    $ref: '#/components/schemas/ActivitySessionV1'
                events:
                  type: array
                  maxItems: 50
                  items:
                    $ref: '#/components/schemas/ActivityEventV1'
      responses:
        '200':
          description: Per-event status after durable commits; retry unchanged event_id if no ACK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [results]
                properties:
                  results:
                    type: array
                    maxItems: 50
                    items:
                      type: object
                      additionalProperties: false
                      required: [event_id, status]
                      properties:
                        event_id:
                          type: string
                          format: uuid
                        status:
                          type: string
                          enum: [accepted, duplicate_noop, rejected, retryable]
                        reason_code:
                          type: string
                          description: Stable machine-readable code without echoed payload
        '400':
          description: Malformed batch envelope
        '401':
          description: Authentication required
        '413':
          description: Request body exceeds configured byte limit
        '429':
          description: Rate limited; honor Retry-After
  /v1/insights/session-kpis:
    get:
      operationId: getSessionKpis
      tags: [Insights]
      summary: Canonical session KPI aggregation for authenticated parent scope
      description: |
        LMP-52 query-time aggregation over accepted ActivitySessionV1 rows and related
        activity_completed events. Excludes rejected ingest, unsupported schema versions,
        and sessions failing current consent re-check. Returns freshness and sample metadata.
      security:
        - parentAccessToken: []
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date-time
          description: Inclusive UTC window start (session started_at)
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date-time
          description: Exclusive UTC window end (session started_at)
        - name: timezone
          in: query
          required: true
          schema:
            type: string
          description: IANA timezone for distinct play-day boundaries
        - name: child_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: Optional child filter; omit for all active children owned by the parent
      responses:
        '200':
          description: Versioned KPI dictionary with freshness metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionKpiResponse'
        '400':
          description: Invalid window or timezone
        '401':
          description: Authentication required
        '404':
          description: Child filter not found for authenticated parent
  /v1/auth/web/session:
    post:
      operationId: createParentWebSession
      tags: [Auth]
      summary: Exchange verified web parent bearer for an opaque browser session (BFF only)
      security:
        - parentAccessToken: []
      responses:
        '201':
          description: Opaque session handle for trusted Next.js server, never browser JSON
          content:
            application/json:
              schema:
                type: object
                required: [handle, expires_at]
                properties:
                  handle:
                    type: string
                    minLength: 43
                    maxLength: 43
                  expires_at:
                    type: string
                    format: date-time
        '401':
          description: Not an active web parent session
  /v1/auth/web/me:
    get:
      operationId: getParentWebSession
      tags: [Auth]
      summary: Authorize durable opaque web session without refresh rotation
      parameters:
        - in: header
          name: X-LM-Web-Session
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Authenticated parent summary
          content:
            application/json:
              schema:
                type: object
                required: [parent_id, locale, timezone]
                properties:
                  parent_id:
                    type: string
                    format: uuid
                  locale:
                    type: string
                  timezone:
                    type: string
        '401':
          description: Invalid, revoked, or expired web session
  /v1/auth/web/activity:
    post:
      operationId: markParentWebActivity
      tags: [Auth]
      summary: Extend idle timeout for explicit user activity through trusted BFF only
      description: |
        Requires both X-LM-Web-Session and X-LM-Bff-Secret. Passive GET /me
        does not advance last_used_at. The backend checks absolute and idle expiry.
      parameters:
        - in: header
          name: X-LM-Web-Session
          required: true
          schema:
            type: string
        - in: header
          name: X-LM-Bff-Secret
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Session remains valid and idle clock was extended
          content:
            application/json:
              schema:
                type: object
                required: [parent_id, locale, timezone]
                properties:
                  parent_id:
                    type: string
                    format: uuid
                  locale:
                    type: string
                  timezone:
                    type: string
        '401':
          description: Invalid, idle-expired, or untrusted session
  /v1/auth/web/logout:
    post:
      operationId: logoutParentWebSession
      tags: [Auth]
      summary: Revoke opaque web session and linked parent session
      parameters:
        - in: header
          name: X-LM-Web-Session
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Web session revoked or already absent
  /health:
    get:
      operationId: getHealth
      tags:
        - Health
      summary: Process liveness
      description: |
        Returns process liveness JSON. Unauthenticated. Does not probe PostgreSQL
        or other dependencies — use `GET /health/ready` for readiness.
      responses:
        '200':
          description: Process is alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
              example:
                status: ok
                service: little-minds-backend
                timestamp: '2026-10-27T12:00:00.000Z'
  /health/ready:
    get:
      operationId: getHealthReady
      tags:
        - Health
      summary: Dependency readiness
      description: |
        Returns readiness JSON for load balancers and operator alert scrapers.
        When `DATABASE_URL` is configured, probes PostgreSQL with a lightweight
        `SELECT 1`. When unset, `checks.database: skipped` is allowed **only**
        for `APP_ENV=development` (local Nest without Compose). Staging and
        production missing `DATABASE_URL` return HTTP 503 with
        `status: not_ready` and `checks.database: down`. Probe failure likewise
        returns 503 (alert-ready signal; no paid monitoring required).
        Schema enums are unchanged (`up` | `down` | `skipped`).
      responses:
        '200':
          description: Ready to accept traffic
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessStatus'
              example:
                status: ok
                service: little-minds-backend
                timestamp: '2026-10-28T12:00:00.000Z'
                checks:
                  database: skipped
        '503':
          description: Not ready (dependency failure)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessStatus'
              example:
                status: not_ready
                service: little-minds-backend
                timestamp: '2026-10-28T12:00:00.000Z'
                checks:
                  database: down
  /v1/auth/token/refresh:
    post:
      operationId: refreshParentSession
      tags: [Auth]
      summary: Rotate parent access and refresh tokens
      description: |
        Transactional single-winner refresh (ADR-019). Clients must use single-flight
        refresh and must not retry a consumed refresh token. Lost responses require re-authentication.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: New token pair
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPairResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'
        '401':
          description: Invalid, expired, revoked, or reused refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'
        '429':
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'
  /v1/auth/logout:
    post:
      operationId: logoutParentSession
      tags: [Auth]
      summary: Revoke the current parent session
      description: Requires refresh_token and/or Authorization bearer. Idempotent.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        '204':
          description: Session revoked (or already revoked)
        '400':
          description: Missing refresh and bearer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'
  /v1/auth/logout-all:
    post:
      operationId: logoutAllParentSessions
      tags: [Auth]
      summary: Revoke all sessions for the authenticated parent
      security:
        - parentAccessToken: []
      responses:
        '200':
          description: Sessions revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutAllResponse'
        '401':
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'
  /v1/auth/sessions:
    get:
      operationId: listParentSessions
      tags: [Auth]
      summary: List sessions for the authenticated parent
      security:
        - parentAccessToken: []
      responses:
        '200':
          description: Session summaries (no token material)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParentSessionListResponse'
        '401':
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'
  /v1/auth/sessions/{sessionId}:
    delete:
      operationId: revokeParentSession
      tags: [Auth]
      summary: Revoke one owned session
      security:
        - parentAccessToken: []
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/UuidV4OrV7'
      responses:
        '204':
          description: Revoked (idempotent if already revoked and owned)
        '401':
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'
        '404':
          description: Unknown or not owned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'
  /v1/children:
    post:
      operationId: createChildProfile
      tags: [Parent]
      summary: Create an approximate-age child profile owned by the authenticated parent
      security:
        - parentAccessToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [age_months, reference_date]
              properties:
                age_months:
                  type: integer
                  format: int32
                  minimum: 0
                reference_date:
                  type: string
                  format: date
                nickname:
                  type: string
                  maxLength: 80
                timezone:
                  type: string
                  description: IANA time zone; defaults to Europe/Istanbul
      responses:
        '201':
          description: Created child profile owned by parent
          content:
            application/json:
              schema:
                type: object
                required: [child_id]
                properties:
                  child_id:
                    type: string
                    format: uuid
        '400':
          description: Invalid approximate age or reference date
        '401':
          description: Unauthorized
        '404':
          description: Parent account inactive or unavailable
    get:
      operationId: listChildProfiles
      tags: [Parent]
      summary: List only the authenticated parent's non-deleted child profiles
      security:
        - parentAccessToken: []
      responses:
        '200':
          description: Parent-owned child profiles
          content:
            application/json:
              schema:
                type: object
                required: [children]
                properties:
                  children:
                    type: array
                    items:
                      $ref: '#/components/schemas/ChildProfileResponse'
        '401':
          description: Unauthorized
  /v1/children/{childId}:
    patch:
      operationId: updateChildProfile
      tags: [Parent]
      summary: Update a child profile owned by the authenticated parent
      security:
        - parentAccessToken: []
      parameters:
        - in: path
          name: childId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                age_months:
                  type: integer
                  format: int32
                  minimum: 0
                reference_date:
                  type: string
                  format: date
                nickname:
                  type: string
                  nullable: true
                  maxLength: 80
                timezone:
                  type: string
      responses:
        '200':
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChildProfileResponse'
        '400':
          description: Invalid profile input
        '401':
          description: Unauthorized
        '404':
          description: Not found or not owned
    get:
      operationId: getChildProfile
      tags: [Parent]
      summary: Read a non-deleted child profile only when owned by authenticated parent
      security:
        - parentAccessToken: []
      parameters:
        - in: path
          name: childId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Parent-owned child profile
          content:
            application/json:
              schema:
                type: object
                required: [child_id, nickname, age_months, preferred_locale]
                properties:
                  child_id:
                    type: string
                    format: uuid
                  nickname:
                    type: string
                    nullable: true
                  age_months:
                    type: integer
                  preferred_locale:
                    type: string
        '401':
          description: Unauthorized
        '404':
          description: Missing, soft-deleted, or not-owned child profile (uniform)
  /v1/devices/{installationId}/active-child:
    get:
      operationId: getDeviceActiveChild
      tags: [Devices]
      summary: Read the active child bound to a parent-owned device installation
      description: |
        LMP-134. The path `installationId` is an untrusted client installation UUID.
        The server resolves the parent-scoped database `devices.id`, verifies ownership
        against the bearer session parent, and returns the authoritative `child_id` used
        for play-event ingest (`devices.child_id`). Returns 404 when the device row is
        not registered for this parent (sign-in mint registers the row).
      security:
        - parentAccessToken: []
      parameters:
        - in: path
          name: installationId
          required: true
          schema:
            type: string
            format: uuid
          description: Client installation UUID hint (not an authorization credential)
      responses:
        '200':
          description: Current active-child binding for the resolved device row
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceActiveChildBinding'
        '400':
          description: Malformed installation identifier
        '401':
          description: Unauthorized
        '404':
          description: Device not registered for authenticated parent
    put:
      operationId: setDeviceActiveChild
      tags: [Devices]
      summary: Bind or clear the active child for a parent-owned device installation
      description: |
        LMP-134. Atomically updates `devices.child_id` after verifying parent ownership
        of both the resolved device row and the target child profile. Use `child_id: null`
        to clear the binding. Clients MUST send `expected_binding_revision` from the latest
        `GET …/active-child` (or `0` before any bind). Stale revisions return `409`. Concurrent
        updates serialize on the device row (`FOR UPDATE`) and increment `binding_revision`.
      security:
        - parentAccessToken: []
      parameters:
        - in: path
          name: installationId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [child_id, expected_binding_revision]
              properties:
                child_id:
                  type: string
                  format: uuid
                  nullable: true
                  description: Owned child profile to authorize on this device, or null to clear
                expected_binding_revision:
                  type: integer
                  format: int32
                  minimum: 0
                  description: Compare-and-set token from the latest binding read; rejects stale binds with 409
      responses:
        '200':
          description: Updated binding
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceActiveChildBinding'
        '400':
          description: Invalid body or installation identifier
        '401':
          description: Unauthorized
        '404':
          description: Device not registered or child not owned by parent
        '409':
          description: Stale expected_binding_revision (concurrent bind won)
  /v1/privacy/consent/effective:
    get:
      operationId: getEffectiveConsentScopes
      tags: [Privacy]
      summary: Read latest-effective server consent for one or more scopes
      description: |
        LMP-134 / F-033. Evaluates immutable `consent_records` with trusted
        `source: server_consent_store` (and ingest-trusted `sync_scope_grant`) using the
        same latest-effective semantics as activity ingest. Optional `child_id` merges
        parent-level and child-scoped rows like ingest `checkConsent`. Does not treat
        privacy-notice acknowledgment, Parent Gate, login, or client wire `decision` as grant.
      security:
        - parentAccessToken: []
      parameters:
        - in: query
          name: scope
          required: true
          schema:
            type: array
            minItems: 1
            items:
              $ref: '#/components/schemas/ConsentScope'
          style: form
          explode: true
          description: One or more consent scopes to evaluate (repeat `scope` query keys)
        - in: query
          name: child_id
          required: false
          schema:
            allOf:
              - $ref: '#/components/schemas/UuidV4OrV7'
            nullable: true
          description: When set, include child-scoped rows for this owned profile
      responses:
        '200':
          description: Effective authorization snapshot per requested scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EffectiveConsentScopesResponse'
        '400':
          description: Missing or invalid scope query
        '401':
          description: Unauthorized
        '404':
          description: Child filter not found for authenticated parent
  /v1/privacy/consent/grant:
    post:
      operationId: grantConsentScope
      tags: [Privacy]
      summary: Record an explicit parent opt-in for a consent scope
      description: |
        LMP-134. Appends an immutable `consent_records` row with `status: granted` and
        `source: server_consent_store`. Play telemetry (`essential_play_events`) must use
        this explicit grant (unchecked client UX) — never auto-granted at login/OTP verify
        or gameplay start. Align `policy_version` with the published activity policy
        (Shape Matching UAT uses `synthetic-policy-v1`).
      security:
        - parentAccessToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsentScopeMutationRequest'
      responses:
        '201':
          description: Grant recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentScopeMutationResponse'
        '400':
          description: Invalid body
        '401':
          description: Unauthorized
        '404':
          description: Child filter not found for authenticated parent
  /v1/privacy/consent/withdraw:
    post:
      operationId: withdrawConsentScope
      tags: [Privacy]
      summary: Record withdrawal of a consent scope (prospective)
      description: |
        LMP-134. Appends `status: withdrawn` with `source: server_consent_store`. Future
        ingest for that scope/policy fails closed; does not rewrite historical events.
      security:
        - parentAccessToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsentScopeMutationRequest'
      responses:
        '201':
          description: Withdrawal recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentScopeMutationResponse'
        '400':
          description: Invalid body
        '401':
          description: Unauthorized
        '404':
          description: Child filter not found for authenticated parent
  /v1/children/{childId}/missions:
    get:
      operationId: listChildMissionStatus
      tags: [Missions]
      summary: List mission interaction and parent-reported status for an owned child
      description: |
        LMP-130 read contract. Requires bounded half-open UTC window (`from`, `to`, max
        90-day span). Loads all eligible rows inside the window (no silent scan cap);
        `limit` paginates merged results only. Does not infer physical-world completion.
      security:
        - parentAccessToken: []
      parameters:
        - in: path
          name: childId
          required: true
          schema:
            type: string
            format: uuid
        - in: query
          name: from
          required: true
          schema:
            type: string
            format: date-time
          description: Inclusive UTC lower bound for report/interaction timestamps
        - in: query
          name: to
          required: true
          schema:
            type: string
            format: date-time
          description: Exclusive UTC upper bound for report/interaction timestamps
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        '200':
          description: Mission status rows with explicit absence semantics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MissionStatusListResponse'
        '400':
          description: Invalid window or limit
        '401':
          description: Unauthorized
        '404':
          description: Child not found or not owned
  /v1/children/{childId}/missions/{missionId}/feedback:
    post:
      operationId: submitChildMissionFeedback
      tags: [Missions]
      summary: Record caregiver-reported mission status for an owned child occurrence
      description: |
        LMP-130 write contract. Parent Gate required. Server sets recorded_at and
        ignores client-supplied parent identity. Idempotent on idempotency_key.
      security:
        - parentAccessToken: []
      parameters:
        - in: path
          name: childId
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: missionId
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
            pattern: '^[a-z][a-z0-9]*(?:[._-][a-z0-9]+)*$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MissionFeedbackWriteRequest'
      responses:
        '200':
          description: Accepted or duplicate_noop acknowledgement
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MissionFeedbackWriteResponse'
        '400':
          description: Malformed body or unsupported schema_version
        '401':
          description: Unauthorized
        '403':
          description: Parent Gate grant or consent missing
        '404':
          description: Child or mission not found
        '409':
          description: Idempotency conflict or invalid transition
